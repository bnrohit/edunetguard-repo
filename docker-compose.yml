services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edunetguard-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      - REACT_APP_API_URL=/api
      - REACT_APP_REFRESH_INTERVAL=${REACT_APP_REFRESH_INTERVAL:-30000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edunetguard

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edunetguard-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - UPTIME_KUMA_URL=${UPTIME_KUMA_URL:-http://uptime-kuma:3001}
      - UPTIME_KUMA_STATUS_PAGE=${UPTIME_KUMA_STATUS_PAGE:-edunetguard}
      - CACHE_TTL=${CACHE_TTL:-30}
      - ALLOW_DEMO_FALLBACK=${ALLOW_DEMO_FALLBACK:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - USER_JOIN_CODE=${USER_JOIN_CODE:-}
      - ADMIN_JOIN_CODE=${ADMIN_JOIN_CODE:-}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-43200}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - USER_DATA_DIR=/app/user-data
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
      - edunetguard-user-data:/app/user-data
    depends_on:
      uptime-kuma:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - edunetguard

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: edunetguard-kuma
    restart: unless-stopped
    ports:
      - "${KUMA_BIND_IP:-127.0.0.1}:${KUMA_ADMIN_PORT:-3001}:3001"
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      - TZ=${TZ:-America/Denver}
    networks:
      - edunetguard

volumes:
  uptime-kuma-data:
    driver: local
  edunetguard-user-data:
    driver: local

networks:
  edunetguard:
    driver: bridge
