services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: edunetguard-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - REACT_APP_API_URL=http://localhost:4000/api
      - REACT_APP_REFRESH_INTERVAL=15000
      - CHOKIDAR_USEPOLLING=true
    command: npm start
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: edunetguard-backend-dev
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./config:/app/config:ro
      - ./data:/app/data:ro
      - edunetguard-user-dev-data:/app/user-data
    environment:
      - NODE_ENV=development
      - PORT=4000
      - UPTIME_KUMA_URL=http://uptime-kuma:3001
      - CACHE_TTL=10
      - ALLOW_DEMO_FALLBACK=true
      - AUTH_SECRET=${AUTH_SECRET:-}
      - USER_JOIN_CODE=${USER_JOIN_CODE:-}
      - ADMIN_JOIN_CODE=${ADMIN_JOIN_CODE:-}
      - USER_DATA_DIR=/app/user-data
      - COOKIE_SECURE=false
    command: npm run dev
    depends_on:
      - uptime-kuma

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: edunetguard-kuma-dev
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-dev-data:/app/data
    environment:
      - TZ=${TZ:-America/Denver}

volumes:
  uptime-kuma-dev-data:
  edunetguard-user-dev-data:
